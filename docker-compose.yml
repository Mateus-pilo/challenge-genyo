services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-employee_crud}
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    working_dir: /app
    init: true
    command: sh -c "npm install && npm run start:dev"
    ports:
      - '${API_HOST_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_HOST_PORT:-4200}}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/${MONGO_DATABASE:-employee_crud}}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:${API_PORT:-3000}/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /app
    init: true
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port ${WEB_PORT:-4200} --proxy-config proxy.conf.js"
    ports:
      - '${WEB_HOST_PORT:-4200}:${WEB_PORT:-4200}'
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEB_PORT:-4200}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:${API_PORT:-3000}}
      NG_CLI_ANALYTICS: ${NG_CLI_ANALYTICS:-false}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  api_node_modules:
  web_node_modules:
